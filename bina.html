<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🧱 Bina Perkataan</title>
<link rel="stylesheet" href="style.css">
<style>
  .pic { font-size:90px; margin-top:10px; animation:float 1.5s infinite; }
  .table { display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:8px; padding:15px;
           background:#8b5a2b; border:6px solid #3b2a1a; max-width:480px; margin:10px auto; }
  .slot, .tile { min-width:80px; height:70px; padding:0 8px; border:4px solid #000; display:flex;
           align-items:center; justify-content:center; font-size:34px; font-weight:bold; color:#fff; text-shadow:3px 3px #000; }
  .slot { background:#6b6b6b; box-shadow:inset 4px 4px #3f3f3f; }
  .slot.result { min-width:150px; background:#5dbb3a; }
  .op { font-size:30px; color:#fff; font-weight:bold; }
  .tiles { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; padding:10px; max-width:480px; margin:auto; }
  .tile { background:#3a8fd9; cursor:pointer; box-shadow:inset -4px -4px #1f5f99, inset 4px 4px #8cc4f0; }
  .tile.used { opacity:.3; pointer-events:none; }
  .glow { animation:glow .5s infinite alternate; }
  @keyframes glow { to { box-shadow:0 0 20px 8px #ffd700; } }
  .stats { font-size:16px; color:#333; margin-bottom:12px; line-height:1.6; }
  /* 📚 NEW: smaller blocks for long words (3+ syllables) */
  .table.long .slot { min-width:58px; height:58px; font-size:24px; padding:0 4px; }
  .table.long .slot.result { min-width:180px; }
  .table.long .op { font-size:22px; }
  .tiles.long .tile { min-width:62px; height:58px; font-size:26px; }
  #unitPick { max-width:95vw; font-size:15px; }
  #micWord { word-break:break-word; }
  .review { display:inline-block; background:#ffd700; border:3px solid #000; padding:2px 8px; font-weight:bold; }
</style>
</head>
<body>
  <div class="sky">
    <h1>🧱 Bina Perkataan</h1>
    <select id="unitPick" class="btn"></select>  <!-- 📚 NEW -->
    <div id="hint">Susun suku kata jadi perkataan!</div>
  </div>

  <div style="text-align:center">
    <div id="pic" class="pic"></div>
    <button class="btn" onclick="sayWord()">🔊 Dengar</button>
  </div>

  <div id="table" class="table"></div>
  <div id="tiles" class="tiles"></div>

  <!-- Mic panel (his turn to speak) -->
  <div id="micPanel" class="hidden" style="text-align:center; padding:10px">
    <div class="pWord" style="color:#fff; text-shadow:3px 3px #000">Sebut: <span id="micWord"></span></div>
    <button id="micBtn" class="btn green" style="font-size:48px; padding:15px 30px" onclick="tapMic()">🎤</button>
    <div id="heardText" style="color:#fff; font-size:20px; margin:8px">&nbsp;</div>
    <button class="btn" style="font-size:14px" onclick="parentOK()">👨 Ayah: Betul</button>
  </div>

  <div class="bag">🏠 <span id="bag"></span></div>

  <!-- Win popup -->
  <div id="win" class="popup hidden">
    <div class="card">
      <div class="pEmoji">🏆</div>
      <div class="pWord">Hebat!</div>
      <div id="winBag" style="font-size:28px; margin-bottom:10px;"></div>
      <div id="winStats" class="stats"></div>
      <button class="btn green" onclick="startRound()">🔁 Main lagi</button>
    </div>
  </div>

<script src="data.js"></script>
<script src="sekolah.js"></script>  <!-- 📚 NEW: optional, page still works without it -->
<script src="audio.js"></script>
<script src="listen.js"></script>
<script src="memory.js"></script>
<script>
const ROUND = 3;   // words per round
const $ = (id) => document.getElementById(id);
const shuffle = (a) => a.sort(() => Math.random() - 0.5);
const hasMemory = typeof Memory !== 'undefined';
const MODE_KEY = 'duniaHuruf.bina.mode';   // 📚 NEW: remembers last unit
const MASTER = 4;

let queue, word, step, tries, busy;
let micBusy = false, micTries = 0;
let buildMistakes = 0;
let mode, played = 0;              // 📚 NEW
let reviewIds = [];                // 📚 NEW: words brought back from older units

// ===== 📚 NEW: LOAD + CHECK WORDS =====
// Cleans each entry. A broken entry is skipped (with a warning) instead of crashing the game.
function cleanWord(w, where) {
  if (!w || typeof w.word !== 'string' || !Array.isArray(w.syl) || !w.syl.length) {
    console.warn('⚠️ Skipped a broken word in ' + where + ':', w);
    return null;
  }
  const word = w.word.toLowerCase().trim();
  const syl = w.syl.map(s => String(s).toLowerCase().trim());
  if (syl.join('') !== word.replace(/[\s-]/g, '')) {
    console.warn(`⚠️ Check syllables for "${word}" in ${where}: [${syl.join(', ')}] doesn't spell the word`);
  }
  return {
    word, syl,
    emoji: w.emoji || '📖',
    accept: [...new Set([word, ...(w.accept || []).map(a => String(a).toLowerCase())])]
  };
}

const BASIC = WORDS.map(w => cleanWord(w, 'data.js')).filter(Boolean);

const UNITS = (typeof SCHOOL_UNITS !== 'undefined' ? SCHOOL_UNITS : [])
  .filter(u => u && u.id && Array.isArray(u.words))
  .map(u => ({ ...u, words: u.words.map(w => cleanWord(w, 'sekolah.js / ' + u.id)).filter(Boolean) }))
  .filter(u => u.words.length);

// Every word once (school version wins if the same word is in both)
const ALL = (() => {
  const map = new Map();
  [...BASIC, ...UNITS.flatMap(u => u.words)].forEach(w => map.set(w.word, w));
  return [...map.values()];
})();

const findWord = (id) => ALL.find(w => w.word === id);
const idsOf = (list) => list.map(w => w.word);

function poolFor(m) {
  if (m === 'asas') return BASIC;
  if (m === 'campur') return ALL;
  const u = UNITS.find(u => u.id === m);
  return u ? u.words : BASIC;
}

// ===== 📚 NEW: UNIT SELECTOR =====
function unitLabel(m) {
  let label;
  if (m === 'asas') label = '🧱 Asas';
  else if (m === 'campur') label = '🎲 Campur (semua)';
  else {
    const u = UNITS.find(u => u.id === m);
    label = '📚 ' + [u.week, u.title].filter(Boolean).join(': ');
  }
  if (hasMemory) {
    const pool = poolFor(m);
    const s = Memory.stats('word', idsOf(pool));
    label += ` ⭐${s.mastered}/${pool.length}`;
    if (s.dueToday) label += ' 🔁';
  }
  return label;
}

function buildSelector() {
  const modes = [...UNITS.map(u => u.id), 'asas', 'campur'];
  $('unitPick').innerHTML = '';
  modes.forEach(m => $('unitPick').add(new Option(unitLabel(m), m)));

  // Start on last played unit, else the newest school unit, else Asas
  let saved = null;
  try { saved = localStorage.getItem(MODE_KEY); } catch (e) {}
  $('unitPick').value = modes.includes(saved) ? saved
                      : UNITS.length ? UNITS[UNITS.length - 1].id : 'asas';
}

function refreshLabels() {
  [...$('unitPick').options].forEach(o => o.text = unitLabel(o.value));
}

$('unitPick').onchange = () => {
  try { localStorage.setItem(MODE_KEY, $('unitPick').value); } catch (e) {}
  startRound();
};

// ===== ROUND SETUP =====
function startRound() {
  $('win').classList.add('hidden');
  $('bag').innerHTML = '';
  mode = $('unitPick').value;
  played = 0;
  queue = pickWords();
  nextWord();
}

// 📚 NEW: words from older units that are due today
function dueElsewhere(poolIds) {
  if (!hasMemory) return [];
  let db = {};
  try { db = JSON.parse(Memory.exportData()); } catch (e) {}
  const t = Memory.today();
  return idsOf(ALL).filter(id => {
    if (poolIds.includes(id)) return false;
    const it = db['word:' + id];
    return it && it.due <= t && it.box < MASTER;
  });
}

// 📚 CHANGED: this unit's words + maybe 1 review from an older unit
function pickWords() {
  const pool = poolFor(mode);
  reviewIds = [];
  if (!hasMemory) return shuffle([...pool]).slice(0, ROUND);

  const poolIds = idsOf(pool);
  const isUnit = mode !== 'asas' && mode !== 'campur';
  const old = isUnit ? dueElsewhere(poolIds) : [];

  let ids;
  if (old.length) {
    ids = Memory.pickItems('word', poolIds, ROUND - 1);
    const r = pick(old);
    reviewIds = [r];
    ids = shuffle([...ids, r]);
  } else {
    ids = Memory.pickItems('word', poolIds, ROUND);
  }
  return ids.map(findWord).filter(Boolean);
}

function remember(result) {
  if (!hasMemory) return;
  if (buildMistakes > 0 && (result === 'correct' || result === 'parent')) result = 'help';
  Memory.record('word', word.word, result);
}

// 📚 CHANGED: decoys swap the vowel, so they work for any syllable
// 'bo' gives ba, bi... | 'dik' gives dak, duk... | 'mah' gives mih, muh...
function lookAlikes(s) {
  const i = [...s].findIndex(ch => VOWELS.includes(ch));
  if (i < 0) return [];
  return VOWELS.filter(v => v !== s[i]).map(v => s.slice(0, i) + v + s.slice(i + 1));
}
function makeDecoys(syl) {
  const all = [...new Set(syl.flatMap(lookAlikes))].filter(s => !syl.includes(s));
  return shuffle(all).slice(0, 2);
}

function nextWord() {
  if (!queue.length) return winRound();
  word = queue.shift(); step = 0; tries = 0; busy = false;
  micBusy = false; micTries = 0;
  buildMistakes = 0;
  $('micPanel').classList.add('hidden');
  $('tiles').style.display = '';
  $('pic').textContent = word.emoji;

  // 📚 NEW: tell him (and you) when it's an old word coming back
  $('hint').innerHTML = reviewIds.includes(word.word)
    ? '<span class="review">🔁 Ulang kaji!</span>'
    : 'Susun suku kata jadi perkataan!';

  // 📚 NEW: smaller blocks for long words
  const long = word.syl.length >= 3;
  $('table').classList.toggle('long', long);
  $('tiles').classList.toggle('long', long);

  // Slots: [ ] + [ ] + [ ] = [ ? ]
  $('table').innerHTML = word.syl.map((s, i) =>
      `<div class="slot" id="s${i}"></div>` + (i < word.syl.length - 1 ? '<span class="op">+</span>' : '')
    ).join('') + '<span class="op">=</span><div id="res" class="slot result">?</div>';

  // Tiles: correct syllables + 2 look-alike decoys
  $('tiles').innerHTML = '';
  shuffle([...word.syl, ...makeDecoys(word.syl)]).forEach(s => {
    const t = document.createElement('div');
    t.className = 'tile';
    t.textContent = s.toUpperCase();
    t.dataset.s = s;
    t.onclick = () => tapTile(t);
    $('tiles').appendChild(t);
  });
  sayWord();
}

function sayWord() { Voice.speak(`Jom bina: ${word.word}!`); }

// ===== BUILDING THE WORD =====
function tapTile(t) {
  if (busy) return;
  const need = word.syl[step];
  if (t.dataset.s === need) {
    SFX.hit();
    t.classList.add('used');
    $('s' + step).textContent = need.toUpperCase();
    Voice.speak(need);
    clearGlow(); tries = 0; step++;
    if (step === word.syl.length) build();
    return;
  }
  tries++;
  buildMistakes++;
  t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake');
  if (word.syl.slice(step).includes(t.dataset.s)) Voice.speak(`Betul ada! Tapi sekarang cari ${need} dulu.`);
  else if (tries === 1) Voice.speak('Hmm, hampir! Cuba lagi.');
  else { Voice.speak('Cari ' + need); glow(need); }   // 2nd miss: show the answer
}

async function build() {
  busy = true;
  SFX.pop();
  $('res').textContent = word.word.toUpperCase();
  $('res').classList.add('glow');
  await Voice.speak(word.syl.join('... ') + '... ' + word.word + '!');   // "ke... re... ta... kereta!"
  $('res').classList.remove('glow');

  // His turn to say it
  micTries = 0; micBusy = false;
  $('tiles').style.display = 'none';
  $('micWord').textContent = word.word.toUpperCase();
  $('heardText').innerHTML = '&nbsp;';
  $('micPanel').classList.remove('hidden');
  await Voice.speak('Giliran kamu! Tekan mikrofon, sebut: ' + word.word);
}

// ===== MIC: HE SAYS IT, THE GAME LISTENS =====
async function tapMic() {
  if (micBusy) return;
  micBusy = true;
  speechSynthesis.cancel();
  const btn = $('micBtn');
  btn.textContent = '👂'; btn.classList.add('glow');
  SFX.beep(880, 0.12, 'sine');
  const heard = await Listen.hear('ms');
  btn.textContent = '🎤'; btn.classList.remove('glow');
  $('heardText').textContent = heard.length ? '👂 ' + heard[0] : '👂 ...';

  if (!heard.length) {
    await Voice.speak('Tak dengar lah. Cakap kuat sikit ya!');
  } else if (isMatch(heard, word.accept)) {   // 📚 CHANGED: uses the accept list
    return micSuccess(true, micTries === 0 ? 'correct' : 'help');
  } else {
    micTries++;
    if (micTries === 1) {
      await Voice.speak('Hmm, hampir betul! Dengar sekali lagi ya... ' + word.word);
    } else if (micTries === 2) {
      await Voice.speak('Tak apa. Dengar perlahan-lahan...');
      for (let i = 0; i < word.syl.length; i++) {
        $('s' + i).classList.add('glow');
        await Voice.speak(word.syl[i]);
        $('s' + i).classList.remove('glow');
      }
      await Voice.speak(word.word + '. Cuba lagi!');
    } else {
      await Voice.speak('Jom sebut sama-sama! ' + word.syl.join('... ') + '... ' + word.word + '!');
      return micSuccess(false, 'wrong');
    }
  }
  micBusy = false;
}

async function micSuccess(byHimself, result) {
  remember(result);
  played++;   // 📚 NEW
  $('micPanel').classList.add('hidden');
  SFX.win();
  const star = byHimself ? '⭐' : '';
  $('bag').innerHTML += `<span style="margin:0 6px">${word.emoji}<b style="color:#fff;font-size:18px">${word.word.toUpperCase()}</b>${star}</span>`;
  await Voice.speak(byHimself ? word.word + '! ' + pick(PHRASES.correct) : 'Bagus, kita sebut sama-sama!');
  setTimeout(nextWord, 600);
}

function parentOK() {
  if (micBusy) return;
  micBusy = true;
  micSuccess(true, 'parent');
}

// ===== HELPERS =====
function glow(s) { document.querySelectorAll('.tile:not(.used)').forEach(t => t.classList.toggle('glow', t.dataset.s === s)); }
function clearGlow() { document.querySelectorAll('.tile').forEach(t => t.classList.remove('glow')); }

// 📚 CHANGED: progress for the selected unit
function progressText() {
  if (!hasMemory) return '';
  const pool = poolFor(mode);
  const s = Memory.stats('word', idsOf(pool));
  let txt = `⭐ ${s.mastered}/${pool.length} sudah pandai<br>` +
            `📚 ${s.learning} sedang belajar · 🆕 ${s.fresh} baru`;
  if (pool.length && s.mastered === pool.length) txt += '<br>🎉 Unit ini siap!';
  return txt;
}

function winRound() {
  $('winBag').innerHTML = $('bag').innerHTML;
  $('winStats').innerHTML = progressText();
  refreshLabels();   // 📚 NEW: update ⭐ counts in the selector
  $('win').classList.remove('hidden');
  SFX.win(); confetti();
  Voice.speak(`Hebat! Kamu bina ${played} perkataan!`);
}

function confetti() {
  const colors = ['#5dbb3a', '#3a8fd9', '#ffd700', '#e74c3c', '#e67e22'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = pick(colors);
    c.style.animationDelay = Math.random() * 0.5 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2600);
  }
}

buildSelector();   // 📚 NEW
startRound();
</script>
</body>
</html>
